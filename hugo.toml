baseURL = "https://solarexaminer.com/"
languageCode = "en-us"
title = "Solar Examiner"
enableRobotsTXT = true
copyright = "Solar Examiner"

[pagination]
  pagerSize = 9

[params]
  description = "Independent reporting and buying guides on residential and community solar."
  tagline = "Solar, examined."
  favicon = "☀️"
  author = "SolarExaminer Editorial Team"
  ogDefault = "/og-default.jpg"

[taxonomies]
  category = "categories"
  tag = "tags"

[[menu.main]]
