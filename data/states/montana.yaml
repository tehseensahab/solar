summary: >-
  Montana's statewide residential average was {rate} in {month} ({change} on the year; U.S. {us}), but NorthWestern
  Energy customers felt a much bigger change in February. The year's big change came on February 1, 2026, when
  NorthWestern Energy's residential base rates rose 17% after a 16-month case that put a new gas plant into rates.
  Retail net metering with a yearly credit reset survives at NorthWestern, so solar sized to annual use gains from the
  higher rates.

solar: |-
  Montana is one of the few places where the 2026 rate increase directly improved the case for rooftop solar.
  NorthWestern Energy customers still have retail net metering under Montana law: surplus builds a kWh bank that
  offsets later use, so each kWh a system produces is worth the full retail rate, and that rate rose about 12% on the
  overall residential bill this year.

  The design detail that matters is the annual reset. The Montana Renewable Energy Association says the bank resets to
  zero once a year and leftover credits are forfeited. Choosing a reset month after winter lets summer surplus carry
  through the low-production months; oversizing simply gives power away. The PSC rejected a NorthWestern proposal to
  end net metering and create a separate solar rate class in an earlier case, but utilities can try again, so check
  the current tariff. Systems up to 50 kW qualify; co-ops, which cover much of rural Montana, set their own policies.

net_metering:
  status: "Retail net metering at NorthWestern Energy with an annual kWh-bank reset"
  text: |-
    NorthWestern Energy customers have retail net metering under Montana law for systems up to 50 kW. Surplus
    production builds a kWh bank, which the
    [Montana Renewable Energy Association](https://montanarenewables.org/renewable-energy/net-metering/) says resets
    to zero once a year, with leftover credits forfeited. The PSC rejected a proposal to end net metering and create a
    separate solar rate class in an earlier NorthWestern case. Co-ops set their own policies. Checked October 5, 2026.

utilities:
  - name: NorthWestern Energy
    detail: "PSC decision December 24, 2025, effective February 1, 2026: residential base rates +17%, overall residential bill about +12%; 9.65% return on equity; Yellowstone County Generating Station in rate base at $246.06 million, about $8 a month per typical customer (Missoula Current)."
  - name: Montana-Dakota Utilities and electric co-ops
    detail: "Separate rates; not covered in our research."

meaning: |-
  The NorthWestern decision shows how one new plant can drive a rate case. The PSC allowed $246.06 million of the
  Yellowstone County Generating Station into rate base, between the company's $287 million ask and staff's $227.7
  million recommendation, after staff argued NorthWestern had not met its burden of proof on part of the cost. Coming
  after a 2023 settlement that added about $8 a month at 750 kWh, it was the company's second increase in a short span.
  The plant also brings more than $35 million a year in variable costs across all customers, which will move with
  fuel. Our [rate case explainer](/posts/how-electric-rate-cases-work/) explains interim rates and how they are
  reconciled after a final order.


