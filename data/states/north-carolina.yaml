summary: >-
  North Carolina's residential average was {rate} in {month}, {change} from {prev_month}; the U.S. figure was {us}.
  The next big change is likely January 1, 2027, when Duke Energy settlements now before the NCUC would add roughly $9
  to $10 a month at 1,000 kWh. Solar still makes sense for many homes, but new Duke customers face time-of-use rates,
  a minimum bill and a per-kW charge, and the old net metering riders end on January 1, 2027.

solar: |-
  North Carolina's solar decision for 2026–27 is mostly about rate design. Under the NCUC's March 2023 order (Docket
  E-100, Sub 180), Duke Energy's long-term option for new rooftop customers is Residential Solar Choice: a time-of-use
  schedule with critical peak pricing, a minimum monthly bill and a non-bypassable charge per kW of solar. The order
  described those as a $22 minimum for Duke Energy Carolinas and $28 for Duke Energy Progress, and $0.36 or $0.44
  per kW a month; current tariff amounts may differ.

  Two dates matter. The Net Metering Bridge rider, which credits monthly excess at avoided cost, closes to new
  applicants after December 31, 2026. And customers on the older net metering riders must move to the bridge or a
  time-of-use solar rate on January 1, 2027. Higher base rates in 2027 would raise the value of self-used solar,
  but the minimum bill and per-kW charge cannot be offset. Under a TOU schedule, a battery that serves the evening
  peak earns its keep. Duke's PowerPair solar-plus-battery incentive was reported fully subscribed in DEP territory
  with capacity remaining in DEC territory; confirm before relying on it.

net_metering:
  status: "Traditional net metering ending; Residential Solar Choice (TOU, minimum bill, per-kW charge) for new Duke customers"
  text: |-
    The NCUC's [order in Docket E-100, Sub 180](https://starw1.ncuc.gov/NCUC/ViewFile.aspx?Id=1452268d-1905-4d1e-a5c8-a9e84351e53a)
    (March 2023) replaced traditional net metering for new Duke customers. Older net metering riders end January 1,
    2027; those customers move to the Net Metering Bridge rider or a TOU solar rate. The bridge rider, which credits
    monthly excess at avoided cost, is available to new applicants through December 31, 2026 with yearly capacity
    limits. Residential Solar Choice requires TOU with critical peak pricing, a minimum bill and a non-bypassable per-kW
    charge. We could not check current rider sheets. Checked October 5, 2026.

utilities:
  - name: Duke Energy Carolinas (DEC)
    detail: "Proposed settlement (Docket E-7, Sub 1329), not approved: +$9.39 a month at 1,000 kWh on January 1, 2027 and +$5.52 in 2028, about 9.5% over two years; 9.8% return on equity."
  - name: Duke Energy Progress (DEP)
    detail: "Proposed settlement (Docket E-2, Sub 1380), not approved: +$9.62 a month in 2027 and +$5.89 in 2028 at 1,000 kWh; the Attorney General puts the residential increase at 9.3% over two years."
  - name: Dominion Energy North Carolina, co-ops and city utilities
    detail: "Separate rates; not covered in our research."

meaning: |-
  Duke's North Carolina cases show how far a request can shrink before a decision: from about 18% for residential
  customers over two years at filing, to 11.6% after Duke's own June revision, to about 9.5% in the settlements with
  the Public Staff and others. Attorney General Jeff Jackson did not sign either deal and disputed Duke's description
  of the DEP impact, and Governor Josh Stein has criticized the increase. The commission can approve, modify or reject
  the settlements; as of late September no final order had been reported. Duke has also proposed combining DEC and DEP
  from January 1, 2027, which needs state and federal approval. Our
  [rate case explainer](/posts/how-electric-rate-cases-work/) explains why settled amounts usually land below
  requests.

faq:
  - q: "Is solar worth it in North Carolina?"
    a: "It can be, but the rules for new Duke customers are tighter: Residential Solar Choice uses time-of-use pricing, a minimum monthly bill and a per-kW charge, and the Net Metering Bridge rider closes to new applicants after December 31, 2026. Systems sized to daytime use, or paired with a battery for the evening peak, hold their value best."
  - q: "What is the average electricity rate in North Carolina?"
    a: "EIA puts North Carolina's statewide residential average at {rate} in {month}, against {prev} in {prev_month}. Duke Energy Carolinas' 1,000 kWh residential bill was cited at $156.81 in July 2026 settlement coverage."

