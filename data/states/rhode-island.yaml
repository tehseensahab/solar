rate_note: Rhode Island Energy's last resort service rate (supply only) moved to a filed winter level of 17.029¢/kWh on October 1, 2026 ([Rhode Island PUC](https://ripuc.ri.gov/utility-information/electric/rhode-island-energy-last-resort-service)); the statewide figure above is all-in and blends in summer pricing.

summary: >-
  Rhode Island ranks among the priciest states for electricity, with a residential average of {rate} in {month}
  ({change} from a year earlier; U.S. {us}). On October 1, Rhode Island Energy's default supply rate moved to a filed
  winter level of 17.029¢ per kWh, 54% above summer, partly offset by two bill credits. Net metering still credits
  newer rooftop systems at a large share of retail, which keeps solar's case strong in one of the country's priciest
  markets.

solar: |-
  High prices are Rhode Island's best argument for solar, and its net metering rules still let homeowners capture most of
  that value. Power you use as it is produced offsets the full retail rate. For exports, an installer guide says systems
  interconnected after April 15, 2023 receive about 80% of the retail rate, while older systems keep full retail credit.
  Systems can be sized up to 125% of annual on-site use.

  Rhode Island also offers an alternative many states do not: the Renewable Energy Growth program, which pays a fixed price
  per kWh for 15 years under a separate tariff, trading upside for certainty. Seasonal pricing matters less than the
  headline suggests: the winter supply rate raises the value of winter solar, but winter production is much lower than
  summer. Rhode Island Energy filed an updated net metering tariff in May 2026 (Docket 25-50-EL), which we have not yet
  read; confirm the export percentage in the tariff before signing.

net_metering:
  status: "Net metering; exports from systems after April 15, 2023 credited at about 80% of retail (per installer guide)"
  text: |-
    Per [NuWatt Energy's 2026 guide](https://nuwattenergy.com/en/rhode-island/net-metering-guide-2026), systems
    interconnected after April 15, 2023 receive about 80% of the retail rate for exported energy; older systems keep full
    retail credit. Systems may be sized up to 125% of annual use. Rhode Island Energy filed an updated net metering tariff
    on May 18, 2026 ([Docket 25-50-EL](https://ripuc.ri.gov/sites/g/files/xkgbur841/files/2026-05/25-50-EL%20-%20Net%20Metering%20Tariff%20Advice%20-%20Compliance%20%28PUC%205-18-26%29.pdf)),
    which we have not reviewed. A newer filing, Docket 26-30-EL (August 14, 2026), is pending: for systems of 25 kW or
    less it would credit surplus above a home's own use in a billing period at a monthly wholesale rate tied to the ISO New
    England energy price instead of the last resort supply rate, and drop the 125% cap on those excess credits. Comments are
    due November 16 and the evidentiary hearing is November 17, 2026. See our report on the
    [proposed Rhode Island net metering changes](/posts/rhode-island-net-metering-2026/). Checked October 22, 2026.

incentives:
  - name: Renewable Energy Growth (REG) program
    text: "An alternative to net metering that pays a fixed price per kWh for 15 years under a separate Rhode Island Energy tariff. Compare it against net metering on your own usage before choosing. Source: NuWatt Energy's 2026 Rhode Island guide (secondary); rates not verified."

utilities:
  - name: Rhode Island Energy (last resort service)
    detail: "Residential supply 17.029¢/kWh for October 1, 2026 to March 31, 2027 (filed; pending final PUC approval when checked), against 11.092¢ in summer 2026 and 14.770¢ last winter. Credits: about $14 a month from October (PPL acquisition settlement) and $20.45 a month in January–March 2027 (RGGI, approved September 24, 2026)."
  - name: Pascoag Utility District, Block Island and Clear River Electric
    detail: "Not covered in our research."

meaning: |-
  Rhode Island Energy buys default supply in advance for each six-month period and passes the cost through, and winter
  prices are higher across New England because natural gas is in demand for both heating and power. Of the 17.029¢ winter
  rate, 1.604¢ is the Renewable Energy Standard charge, per Uprise RI. About 73% of residential use is on last resort
  service, so the October change reaches most households. The two credits soften the season: by our math, at 500 kWh,
  supply plus credits come to about $15.69 more a month than summer from October to December and about $4.76 less from
  January to March. Customers can also compare community aggregation and competitive suppliers before the April 1, 2027
  reset; our [budget billing guide](/posts/budget-billing-explained/) covers spreading winter costs.


