meaning: |-
  New Jersey's 2026 auction produced small bill changes, helped by the PJM capacity price collar and Executive Order
  No. 1, which directed Residential Universal Bill Credits to offset supply increases from July 1, 2026. Only about a
  third of residential supply is bought in each auction, which smooths year-to-year swings. The next pressure point is
  delivery: JCP&L's request would add about 8.8% to a typical bill from January 2028, with storm costs spread over 10
  years (our [JCP&L report](/posts/jcpl-rate-increase-request-2026/) has the details). For solar, the decision that
  matters most is the BPU's net metering successor. Customers can also shop for supply; our
  [supplier guide](/posts/how-to-compare-electricity-supplier-offers/) explains how to compare against BGS.

faq:
  - q: "Is solar worth it in New Jersey?"
    a: "Under today's retail-rate net metering and high prices, often yes. But the state crossed the 5.8% threshold that lets the BPU replace net metering, and a review is open, so ask installers what crediting rule and term their savings estimate assumes."
  - q: "What is the average electricity rate in New Jersey?"
    a: "EIA puts New Jersey's statewide residential average at {rate} in {month}, against {prev} in {prev_month}. The BPU's June 2026 figures put the average 650 kWh bill between about $137 (JCP&L) and $202 (ACE)."

