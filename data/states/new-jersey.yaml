summary: >-
  Statewide, New Jersey's residential average was {rate} in {month} ({change} on the year), against {us} nationally.
  Supply prices reset each June 1 through the BGS auction, and the 2026 reset barely moved average bills; the next big
  decision is JCP&L's request for an increase starting in 2028. Retail-rate net metering remains, but the state has
  crossed the threshold that lets regulators replace it, so new solar buyers face policy risk.

solar: |-
  For now New Jersey credits home solar at the retail volumetric rate, with an annual reconciliation of unused
  credits, which together with high prices gives rooftop systems strong economics. The question hanging over the
  market is how long that lasts. A BPU staff presentation said net-metered generation exceeded 5.8% of total kWh sales
  in energy year 2024, the threshold in state law that allows the Board to consider a different approach. The BPU
  opened Docket QO24090723 and held its first stakeholder workshop in November 2024; we have found no final decision.

  For anyone signing a contract, the practical step is to ask what crediting rule the proposal assumes, for how long,
  and what happens to existing systems if the policy changes. A design that relies on self-consumption holds its value
  better under any successor policy than one that exports heavily. PSE&G has also proposed a residential time-of-use
  rate, which, if approved, would change how much a midday kWh is worth.

net_metering:
  status: "Retail-rate net metering; successor policy under review after crossing the 5.8% threshold"
  text: |-
    A [BPU staff presentation](https://nj.gov/bpu/pdf/publicnotice/19.11.2024%20Jurisdictional%20Survey%20of%20NEM%20Reforms%20-%20Stakeholder%20Workshop%201%5b1%5d%20%20-%20%20Read-Only.pdf)
    describes credits at the retail volumetric rate with an annual reconciliation of unused credits, and says
    net-metered generation exceeded 5.8% of total kWh sales in energy year 2024. The BPU opened Docket QO24090723 and
    held a first stakeholder workshop on November 19, 2024. We have not found a decision or any rule on treatment of
    existing systems. Checked October 5, 2026.

