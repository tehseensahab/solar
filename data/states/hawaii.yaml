meaning: |-
  Hawaii's rates follow fuel prices month by month through the energy cost recovery charge, which is why the
  statewide average can jump sharply in a year without any base-rate decision. The pending general rate case is the
  structural change to watch: Hawaiian Electric has pointed to wildfire-risk investments, insurance premiums and
  equipment costs, and new rates could take effect before January 1, 2027, though we have not confirmed the current
  proposed amount. Advocates argue a full rate case weakens the protection of performance-based regulation, which
  since 2020 has limited between-case increases to an inflation-based formula. For homeowners, higher base rates
  would raise the value of self-consumed solar and storage further. Our
  [battery sizing guide](/posts/battery-sizing-guide/) helps match storage to evening use.


