summary: >-
  No state pays more for electricity: Hawaii's residential average reached {rate} in {month}, {change} from
  {prev_month}, against {us} for the U.S. Hawaiian Electric's rates move monthly with fuel costs, and a general rate
  case could set new base rates for 2027. Solar is close to a default choice here, but with export credits that vary
  by hour, the real decision is the battery.

solar: |-
  No state rewards self-generated power more than Hawaii. On Oahu, a kWh you used yourself in May 2026 avoided an
  all-in residential rate of about 47.75¢. That is why the question is less whether to go solar than how to
  configure it.

  The answer is shaped by Hawaiian Electric's Smart Renewable Energy Export program, which pays for exports by time
  of day. On Oahu, midday exports earn 13.5¢ while evening-peak exports (5 p.m. to 9 p.m.) earn 32.9¢; on Maui the
  daytime credit is just 6.6¢. Panels produce at midday, when the credit is lowest. A battery that stores that
  output and releases it into the evening, either to run the house or to export at the peak credit, captures
  several times the value. Credits are trued up annually and leftovers expire, so oversizing still wastes
  production. Kauai Island Utility Cooperative customers have their own programs.

net_metering:
  status: "No net metering for new customers; time-of-day export credits under Smart Renewable Energy Export"
  text: |-
    New rooftop customers on Hawaiian Electric's five island systems use
    [Smart Renewable Energy Export](https://www.hawaiianelectric.com/products-and-services/smart-renewable-energy-programs/smart-renewable-energy-export).
    Credits for 2024 to 2026 depend on island and time of day: on Oahu 18.9¢ overnight, 13.5¢ daytime and 32.9¢
    in the 5 p.m. to 9 p.m. peak; on Hawaii Island 14.8¢, 10.6¢ and 23.1¢; on Maui 13.1¢, 6.6¢ and 18.2¢. New
    customers get a seven-year rate lock, with updates every three years after that. Credits are reconciled yearly
    and leftover credits expire. Batteries can earn separate payments under Bring Your Own Device Plus.
    Checked October 5, 2026.

