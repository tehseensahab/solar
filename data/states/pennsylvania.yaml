meaning: |-
  Pennsylvania's default supply prices reset on June 1 and December 1, based on wholesale market costs, and the PUC notes
  generation can be half or more of a total bill. June's increases ranged from 1.5% at PPL to nearly 12% at Penelec, with
  FirstEnergy's western utilities hit hardest. The PUC also warned that fewer supplier offers beat the Price to Compare
  than in past years, and that many that do are short introductory deals of three to six months. Before switching, check
  the term, renewal price and any cancellation fee; our
  [supplier comparison guide](/posts/how-to-compare-electricity-supplier-offers/) uses Pennsylvania's disclosure rules
  as its worked example. The December 1 reset is the next change to watch.


