rate_note: PECO's price to compare (supply only) is 11.572¢/kWh from June 1, 2026, a PUC estimate ([Pennsylvania PUC](https://www.puc.pa.gov/press-release/2026/puc-alerts-consumers-to-june-1-electric-price-changes-and-higher-summer-energy-costs-5-20-26)); the statewide figure above is all-in.

summary: >-
  Pennsylvania's residential average was {rate} in {month}, {change} on the year, compared with {us} nationally.
  Default supply prices (the Price to Compare) rose at every major utility on June 1, by as much as 12% at Penelec,
  and reset again on December 1. Retail-rate net metering under state rules keeps rooftop solar among the better
  options in the PJM region.

solar: |-
  Pennsylvania's net metering rules are written into the state code and are generous by current standards. Under 52 Pa.
  Code §75.13, utilities credit residential solar at the full retail kWh rate, including generation, transmission and
  distribution, for production up to your usage in a billing period. Excess kWh carry forward to later bills, and at the
  end of the year any leftover excess is paid at the default service provider's Price to Compare. Residential systems
  can be up to 50 kW.

  So nearly every solar kWh is worth retail if the system is sized to annual use, and only true surplus falls to the
  supply price. Rising supply prices, driven by PJM wholesale costs, add to that value for customers on default service.
  If you shop with a competitive supplier, your contract price affects what the generation part of the credit is worth,
  so check how your supplier handles net metering before switching.

net_metering:
  status: "Retail net metering under state code; year-end surplus paid at the Price to Compare"
  text: |-
    [52 Pa. Code §75.13](https://law.cornell.edu/regulations/pennsylvania/52-Pa-Code-SS-75-13) requires utilities to
    credit customer-generators at the full retail kWh rate, including generation, transmission and distribution, up to
    usage in the billing period; excess kWh carry forward, and unused excess at year-end is paid at the Price to Compare.
    Residential systems are limited to 50 kW nameplate. Checked October 18, 2026.

