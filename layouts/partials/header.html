<header class="site-header">
  <div class="masthead">
    <a href="/"><span class="brand-text">Solar Examiner</span></a>
    <span class="brand-tag">{{ site.Params.description }}</span>
  </div>
  <nav class="nav-strip" aria-label="Main">
    <div class="wrap">
      {{- range site.Menus.main }}
      {{- $exact := eq .URL "/" }}
      {{- $active := cond $exact (eq $.RelPermalink .URL) (hasPrefix $.RelPermalink .URL) }}
      <a href="{{ .URL }}"{{ if $active }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </div>
  </nav>
</header>
