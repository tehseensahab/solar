{{ define "main" }}
<div class="wrap page-head">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
</div>
<section class="section wrap">
  {{ $pager := .Paginate .Pages }}
  {{ partial "card-grid.html" $pager.Pages }}
  {{ template "_internal/pagination.html" . }}
</section>
{{ end }}
